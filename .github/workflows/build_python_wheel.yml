name: Build Python Wheel
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: buildpack-deps:buster
    steps:
      - name: Update apt sources
        run: echo "deb https://archive.debian.org/debian buster main" > /etc/apt/sources.list && echo "deb https://archive.debian.org/debian-security buster/updates main" >> /etc/apt/sources.list && echo "deb https://archive.debian.org/debian buster-updates main" >> /etc/apt/sources.list
      - name: Install dependencies
        run: apt-get update && apt-get install -y --no-install-suggests --no-install-recommends python-setuptools python-wheel
      - name: Checkout
        run: git clone --depth 1 --no-tags --single-branch ${{ github.repositoryUrl }}
      - run: cd PyBitmessage
      - name: Build sdist
        run: python2 setup.py sdist
      - name: Build wheel
        run: python2 setup.py bdist_wheel
