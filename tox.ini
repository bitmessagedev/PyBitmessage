[tox]
requires = virtualenv<20.22.0
envlist = reset,py{27,27-portable,35,36,38,39,310},stats
skip_missing_interpreters = true

[testenv]
setenv =
    BITMESSAGE_HOME = {envtmpdir}
    HOME = {envtmpdir}
    PYTHONWARNINGS = default
deps = -rrequirements.txt
commands =
    python checkdeps.py
    python src/bitmessagemain.py -t
    coverage run -a -m tests

[testenv:py27]
sitepackages = true

[testenv:py27-portable]
skip_install = true
commands = python pybitmessage/bitmessagemain.py -t

[testenv:py35]
skip_install = true

[testenv:py36]
setenv =
    BITMESSAGE_TEST_POW = true
    {[testenv]setenv}

[testenv:reset]
skip_install = true
deps = coverage
commands = coverage erase

[testenv:stats]
skip_install = true
deps = coverage
commands =
    coverage report
    coverage xml

[coverage:run]
source = src
omit =
    tests.py
    */tests/*
    src/version.py
    src/fallback/umsgpack/*

[coverage:report]
ignore_errors = true
